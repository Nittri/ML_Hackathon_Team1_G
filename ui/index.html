<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PathSnap route evaluator</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 2rem auto; max-width: 960px; padding: 0 1rem; color: #17212b; }
    button, select { font: inherit; padding: .5rem .75rem; }
    #status { margin: 1rem 0; min-height: 1.5rem; }
    #metrics { display: flex; flex-wrap: wrap; gap: .75rem; }
    .metric { background: #eef4f8; padding: .75rem; border-radius: .4rem; }
    #map { width: 100%; height: 480px; border: 1px solid #bbb; }
    #route { max-height: 10rem; overflow: auto; }
  </style>
</head>
<body>
  <h1>PathSnap route evaluator</h1>
  <p>Select an evaluation trip. The reference route stays on the server and is used only to calculate metrics.</p>
  <label for="trip">Trip</label>
  <select id="trip"></select>
  <button id="run">Reconstruct route</button>
  <div id="status" role="status"></div>
  <section id="metrics" aria-live="polite"></section>
  <h2>GPS and predicted road route</h2>
  <div id="map"></div>
  <h2>Predicted directed arc IDs</h2>
  <pre id="route"></pre>
  <script>
    const tripSelect = document.getElementById("trip");
    const status = document.getElementById("status");
    const metrics = document.getElementById("metrics");
    const route = document.getElementById("route");
    const map = document.getElementById("map");

    async function loadTrips() {
      status.textContent = "Loading evaluation trips...";
      const response = await fetch("/api/trips");
      if (!response.ok) throw new Error(await response.text());
      const result = await response.json();
      tripSelect.replaceChildren(...result.trip_ids.map((tripId) => {
        const option = document.createElement("option");
        option.value = tripId;
        option.textContent = tripId;
        return option;
      }));
      status.textContent = `${result.trip_ids.length} trips ready`;
    }

    function renderMap(result) {
      const bounds = result.gps_points.map((point) => [point.lat, point.lon]);
      const predicted = result.predicted_route_coordinates.flat();
      const all = bounds.concat(predicted);
      if (!all.length) return;
      const lats = all.map((point) => point[0]);
      const lons = all.map((point) => point[1]);
      const minLat = Math.min(...lats), maxLat = Math.max(...lats);
      const minLon = Math.min(...lons), maxLon = Math.max(...lons);
      const gpsLayer = result.gps_points.map((point) =>
        `<circle cx="${(point.lon - minLon) / Math.max(maxLon - minLon, 1e-8) * 1000}" ` +
        `cy="${460 - (point.lat - minLat) / Math.max(maxLat - minLat, 1e-8) * 460}" ` +
        `r="3" fill="#1f77b4"><title>GPS observation</title></circle>`).join("");
      const routeLayer = result.predicted_route_coordinates.map((segment) => {
        const points = segment.map((point) =>
          `${(point[1] - minLon) / Math.max(maxLon - minLon, 1e-8) * 1000},` +
          `${460 - (point[0] - minLat) / Math.max(maxLat - minLat, 1e-8) * 460}`).join(" ");
        return `<polyline points="${points}" fill="none" stroke="#d62728" stroke-width="3"/>`;
      }).join("");
      map.innerHTML = `<svg viewBox="0 0 1000 500" role="img" aria-label="GPS and predicted route map">` +
        `<rect width="1000" height="500" fill="#f7f7f7"/>` +
        `<g transform="translate(0 20)">${routeLayer}${gpsLayer}</g></svg>` +
        `<p><span style="color:#1f77b4">● GPS observations</span> &nbsp; ` +
        `<span style="color:#d62728">━ Predicted route</span></p>`;
    }

    document.getElementById("run").addEventListener("click", async () => {
      status.textContent = "Reconstructing route...";
      metrics.replaceChildren();
      route.textContent = "";
      try {
        const response = await fetch("/api/predict", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({trip_id: tripSelect.value})
        });
        if (!response.ok) throw new Error(await response.text());
        const result = await response.json();
        Object.entries(result.metrics).forEach(([name, value]) => {
          const item = document.createElement("div");
          item.className = "metric";
          item.textContent = `${name.replaceAll("_", " ")}: ${Number(value).toFixed(4)}`;
          metrics.append(item);
        });
        route.textContent = result.predicted_arc_ids.join(", ");
        renderMap(result);
        status.textContent = `Trip ${result.trip_id} completed using ${result.model}`;
      } catch (error) {
        status.textContent = `Request failed: ${error.message}`;
      }
    });

    loadTrips().catch((error) => { status.textContent = `Could not load trips: ${error.message}`; });
  </script>
</body>
</html>
